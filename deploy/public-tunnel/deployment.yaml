# Configure the dedicated Cloudflare Tunnel's single public hostname to
# http://loop-pwa.habits.svc.cluster.local:8080. Other lab apps remain private.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-public-tunnel
spec:
  replicas: 1
  selector:
    matchLabels: {app: loop-public-tunnel}
  template:
    metadata:
      labels: {app: loop-public-tunnel}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tunnel
          image: cloudflare/cloudflared:2026.9.3
          args: [tunnel, --no-autoupdate, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: loop-public-tunnel, key: token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
