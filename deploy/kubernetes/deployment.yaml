apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-pwa
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: loop-pwa
  template:
    metadata:
      labels:
        app: loop-pwa
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: static-shell
          image: loop-pwa:release
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: config, mountPath: /usr/share/nginx/html/app/config.mjs, subPath: config.mjs, readOnly: true}
      volumes:
        - name: temporary
          emptyDir: {}
        - name: config
          configMap: {name: loop-public-config}
